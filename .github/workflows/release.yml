name: Release

# Koerer naar du pusher en tag der starter med 'v', fx v1.0.0
on:
  push:
    tags:
      - 'v*'
  # Tillader ogsaa at koere manuelt fra GitHub-UI'et under "Actions"
  workflow_dispatch:

permissions:
  contents: write   # noedvendigt for at oprette en Release

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            runtime: win-x64
            assembly_name: cliCode2Web
            zip_name: Code2Web-win-x64
          - name: macOS ARM (Apple Silicon)
            os: macos-latest
            runtime: osx-arm64
            assembly_name: cliCode2Web
            zip_name: Code2Web-macos-arm64
          - name: macOS Intel
            os: macos-13           # macos-13 er den sidste Intel-runner
            runtime: osx-x64
            assembly_name: cliCode2Web-x64
            zip_name: Code2Web-macos-x64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find .csproj
        id: find_proj
        shell: bash
        run: |
          proj=$(find . -name 'cliCode2Web.csproj' -print -quit)
          if [ -z "$proj" ]; then
            proj=$(find . -name '*.csproj' -print -quit)
          fi
          if [ -z "$proj" ]; then
            echo "Fandt ingen .csproj"
            exit 1
          fi
          echo "project=$proj" >> "$GITHUB_OUTPUT"
          echo "Bygger : $proj"

      - name: Publish
        shell: bash
        run: |
          dotnet publish "${{ steps.find_proj.outputs.project }}" \
            -c Release \
            -r ${{ matrix.runtime }} \
            -p:PublishSingleFile=true \
            -p:AssemblyName=${{ matrix.assembly_name }} \
            --self-contained true \
            -o publish-output

      - name: Bundle shipped references (hvis versioneret i repoet)
        shell: bash
        run: |
          if [ -d references-shipped ]; then
            mkdir -p publish-output/references
            cp references-shipped/*.txt publish-output/references/ 2>/dev/null || true
            count=$(find publish-output/references -name '*.txt' | wc -l | tr -d ' ')
            echo "Pakkede $count reference(r) ind i builden."
          else
            echo "Ingen references-shipped/ i repoet - springer references over."
          fi

      - name: Set unix executable bit (macOS only)
        if: runner.os == 'macOS'
        run: chmod +x "publish-output/${{ matrix.assembly_name }}"

      - name: Create zip
        shell: bash
        run: |
          cd publish-output
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.zip_name }}.zip" .
          else
            zip -r "../${{ matrix.zip_name }}.zip" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
